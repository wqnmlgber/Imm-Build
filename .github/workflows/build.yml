name: Build

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build and release even if the latest version already exists'
        required: true
        default: false
        type: boolean

      clean:
        description: 'Run make clean before building'
        required: true
        default: false
        type: boolean

  schedule:
    # Every Monday at 02:17 UTC
    - cron: '17 2 * * 1'


permissions:
  contents: write


env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  TARGET_DIR: immortalwrt/bin/targets/x86/64


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout your build configuration repository
      # ============================================================

      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd


      # ============================================================
      # 3. Automatically find latest ImmortalWrt 25.12.x
      # ============================================================

      - name: Resolve latest ImmortalWrt v25.12.x
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching latest ImmortalWrt v25.12.x"
          echo "========================================"

          LATEST_TAG="$(
            git ls-remote --tags --refs "$REPO_URL" \
              | awk -F/ '{print $3}' \
              | grep -E '^v25\.12\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No v25.12.x tag found."
            exit 1
          fi

          echo "Latest version: $LATEST_TAG"

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. Check whether this version has already been released
      # ============================================================

      - name: Check existing release
        id: check_release
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          RELEASE_TAG="immortalwrt-${VERSION}"

          echo "Checking release: ${RELEASE_TAG}"

          if [ "$FORCE" = "true" ]; then

            echo "Force build enabled."

            echo "should_build=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          if git ls-remote --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${RELEASE_TAG}" \
              | grep -q "$RELEASE_TAG"; then

            echo "Release already exists:"
            echo "$RELEASE_TAG"

            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else

            echo "New version detected:"
            echo "$VERSION"

            echo "should_build=true" >> "$GITHUB_OUTPUT"

          fi


      # ============================================================
      # 5. Stop if this version already exists
      # ============================================================

      - name: Skip already released version
        if: steps.check_release.outputs.should_build != 'true'
        run: |
          echo "========================================"
          echo "No new ImmortalWrt 25.12.x version."
          echo "Build skipped."
          echo "========================================"


      # ============================================================
      # 6. Clone exact ImmortalWrt release tag
      # ============================================================

      - name: Clone ImmortalWrt
        if: steps.check_release.outputs.should_build == 'true'
        id: source
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Cloning ImmortalWrt ${VERSION}"

          git clone \
            --branch "$VERSION" \
            --single-branch \
            --filter=blob:none \
            "$REPO_URL" \
            immortalwrt

          cd immortalwrt

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_VERSION="$(git describe --tags --always)"

          echo "========================================"
          echo "Source version: ${SOURCE_VERSION}"
          echo "Source commit : ${SOURCE_COMMIT}"
          echo "========================================"

          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 7. Restore ccache
      # ============================================================

      - name: Restore ccache
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-25.12-${{ steps.resolve.outputs.tag }}-${{ hashFiles('.config') }}

          restore-keys: |
            immortalwrt-25.12-${{ steps.resolve.outputs.tag }}-
            immortalwrt-25.12-


      # ============================================================
      # 8. Configure ccache
      # ============================================================

      - name: Configure ccache
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache -z


      # ============================================================
      # 9. Update feeds
      # ============================================================

      - name: Update feeds
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a


      # ============================================================
      # 10. Install feeds
      # ============================================================

      - name: Install feeds
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        run: |
          ./scripts/feeds install -a


      # ============================================================
      # 11. Copy .config
      # ============================================================

      - name: Copy .config
        if: steps.check_release.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".config" ]; then

            echo "ERROR: .config not found."

            exit 1

          fi

          cp .config immortalwrt/.config

          echo "========================================"
          echo "Custom configuration copied."
          echo "========================================"


      # ============================================================
      # 12. Generate final configuration
      # ============================================================

      - name: Generate final configuration
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          make defconfig

          echo "========================================"
          echo "Target configuration"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | head -50 || true


          # Verify x86 target

          if ! grep -q '^CONFIG_TARGET_x86=y' .config; then

            echo "ERROR: CONFIG_TARGET_x86=y not found."

            exit 1

          fi


          # Verify x86_64 target

          if ! grep -q '^CONFIG_TARGET_x86_64=y' .config; then

            echo "ERROR: CONFIG_TARGET_x86_64=y not found."

            exit 1

          fi


          echo "========================================"
          echo "x86_64 target verified."
          echo "========================================"


      # ============================================================
      # 13. Optional clean build
      # ============================================================

      - name: Clean build
        if: steps.check_release.outputs.should_build == 'true' && inputs.clean == true
        working-directory: immortalwrt
        run: |
          make clean


      # ============================================================
      # 14. Download source packages
      # ============================================================

      - name: Download sources
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        run: |
          make download -j"$(nproc)" V=s


      # ============================================================
      # 15. Build firmware
      # ============================================================

      - name: Build firmware
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting ImmortalWrt build"
          echo "CPU cores: $(nproc)"
          echo "========================================"

          make -j"$(nproc)" world 2>&1 | tee build.log


      # ============================================================
      # 16. Retry failed build
      # ============================================================

      - name: Retry build with verbose output
        if: failure() && steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Parallel build failed."
          echo "Retrying with -j1 V=s"
          echo "========================================"

          make -j1 V=s 2>&1 | tee build-retry.log


      # ============================================================
      # 17. Verify exact release files
      # ============================================================

      - name: Verify release files
        if: success() && steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="bin/targets/x86/64"

          FILES=(

            "immortalwrt-x86-64-generic-image-efi.iso"

            "immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz"

            "immortalwrt-x86-64-generic-ext4-combined-efi.img.gz"

          )


          echo "========================================"
          echo "Checking generated files"
          echo "Directory: $TARGET_DIR"
          echo "========================================"


          for FILE in "${FILES[@]}"; do

            if [ ! -f "$TARGET_DIR/$FILE" ]; then

              echo "ERROR: Missing:"
              echo "$TARGET_DIR/$FILE"

              exit 1

            fi

            echo "OK: $TARGET_DIR/$FILE"

            ls -lh "$TARGET_DIR/$FILE"

          done


      # ============================================================
      # 18. Prepare Release files
      # ============================================================

      - name: Prepare release
        if: success() && steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="bin/targets/x86/64"
          RELEASE_DIR="../release"

          mkdir -p "$RELEASE_DIR"


          # --------------------------------------------------------
          # Copy exactly three firmware files
          # --------------------------------------------------------

          FILES=(

            "immortalwrt-x86-64-generic-image-efi.iso"

            "immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz"

            "immortalwrt-x86-64-generic-ext4-combined-efi.img.gz"

          )


          for FILE in "${FILES[@]}"; do

            cp \
              "$TARGET_DIR/$FILE" \
              "$RELEASE_DIR/ImmortalWrt-${VERSION}-${FILE}"

          done


          cd "$RELEASE_DIR"


          # --------------------------------------------------------
          # Generate SHA256
          # --------------------------------------------------------

          sha256sum \
            "ImmortalWrt-${VERSION}-immortalwrt-x86-64-generic-image-efi.iso" \
            "ImmortalWrt-${VERSION}-immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz" \
            "ImmortalWrt-${VERSION}-immortalwrt-x86-64-generic-ext4-combined-efi.img.gz" \
            > SHA256SUMS


          # --------------------------------------------------------
          # Generate build information
          # --------------------------------------------------------

          {
            echo "ImmortalWrt Version: $VERSION"
            echo "Source Version: $SOURCE_VERSION"
            echo "Source Commit: $SOURCE_COMMIT"
            echo "Target: x86_64"
            echo "Target Directory: bin/targets/x86/64"
            echo "Configuration Repository: $GITHUB_REPOSITORY"
            echo "Configuration Commit: $GITHUB_SHA"
            echo "GitHub Actions Run: $GITHUB_RUN_NUMBER"
            echo "Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > build-info.txt


          echo "========================================"
          echo "Release files"
          echo "========================================"

          ls -lh "$RELEASE_DIR"


      # ============================================================
      # 19. Upload firmware Artifact
      # ============================================================

      - name: Upload firmware artifact
        if: success() && steps.check_release.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ steps.resolve.outputs.tag }}-x86-64
          path: |
            release/**
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 20. Upload build logs
      # ============================================================

      - name: Upload build logs
        if: always() && steps.check_release.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ steps.resolve.outputs.tag }}-build-logs
          path: |
            immortalwrt/build.log
            immortalwrt/build-retry.log
          if-no-files-found: ignore
          retention-days: 14


      # ============================================================
      # 21. Show build statistics
      # ============================================================

      - name: Show build statistics
        if: always() && steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        run: |
          echo "========================================"
          echo "Disk usage"
          echo "========================================"

          df -h


          echo ""
          echo "========================================"
          echo "ccache statistics"
          echo "========================================"

          ccache -s || true


          echo ""
          echo "========================================"
          echo "Generated x86/64 files"
          echo "========================================"

          find bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort || true


      # ============================================================
      # 22. Create GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: success() && steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-${{ steps.resolve.outputs.tag }}
          name: ImmortalWrt ${{ steps.resolve.outputs.tag }} x86-64

          generate_release_notes: false

          body: |
            ## ImmortalWrt ${{ steps.resolve.outputs.tag }} — x86-64

            Automatically built from the ImmortalWrt 25.12.x release tag.

            ### Source

            - Version: `${{ steps.resolve.outputs.tag }}`
            - Commit: `${{ steps.source.outputs.commit }}`

            ### Target

            - Architecture: `x86_64`
            - Target directory: `bin/targets/x86/64`

            ### Included firmware

            - Generic EFI ISO
            - Generic EFI VMDK
            - Generic EFI ext4 IMG

            ### Checksums

            SHA256 checksums are provided in `SHA256SUMS`.

            Build information is provided in `build-info.txt`.

          files: |
            release/ImmortalWrt-${{ steps.resolve.outputs.tag }}-immortalwrt-x86-64-generic-image-efi.iso
            release/ImmortalWrt-${{ steps.resolve.outputs.tag }}-immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz
            release/ImmortalWrt-${{ steps.resolve.outputs.tag }}-immortalwrt-x86-64-generic-ext4-combined-efi.img.gz
            release/SHA256SUMS
            release/build-info.txt

          fail_on_unmatched_files: true
